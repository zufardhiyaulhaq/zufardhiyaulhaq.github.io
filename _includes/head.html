<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% if page.title and page.url != "/" %}{{ page.title }} — {{ site.name }}{% else %}{{ site.name }} — {{ site.description }}{% endif %}</title>

{% if page.excerpt %}
<meta name="description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
<meta property="og:description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
{% else %}
<meta name="description" content="{{ site.description }}">
<meta property="og:description" content="{{ site.description }}">
{% endif %}
<meta name="author" content="{{ site.name }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.name }}">
{% if page.title %}<meta property="og:title" content="{{ page.title }}">
<meta name="twitter:title" content="{{ page.title }}">{% endif %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ '/feed.xml' | relative_url }}">
