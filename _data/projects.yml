# Work — edit here to add / reorder projects.
# products: live things with a URL.  opensource: repos (lang + stars).

products:
  - name: fastgateway.dev
    url: https://fastgateway.dev
    description: >-
      Gateway API management, minus the YAML — a visual control plane for
      routing, policy, approvals, and multi-cluster governance.
  - name: decidenext.app
    url: https://decidenext.app
    description: >-
      Collaborative task prioritization with ICE, RICE, MoSCoW, and WSJF.
      Real-time voting, no signup, consensus without the meeting.

opensource:
