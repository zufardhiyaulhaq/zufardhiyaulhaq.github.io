    url: https://github.com/zufardhiyaulhaq/frp-operator
    lang: Go
    stars: 79
    description: >-
      Expose Kubernetes services to the internet with open-source FRP —
      tunnels defined as native resources.
  - name: istio-ratelimit-operator
    url: https://github.com/zufardhiyaulhaq/istio-ratelimit-operator
    lang: Go
    stars: 51
    description: >-
      Automate Istio rate limiting with EnvoyFilter versioning — declarative
      limits without hand-writing filters.
  - name: Kato
    url: https://github.com/zufardhiyaulhaq/Kato
    lang: Go
    stars: 8
    description: >-
      Kubernetes troubleshooting as declarative UseCase flows — LLMs summarize
      the findings, but never decide what to investigate.
  - name: community-ops
    url: https://github.com/zufardhiyaulhaq/community-ops
    lang: Python
    stars: 31
    description: >-
      GitOps for many Kubernetes clusters with ArgoCD and Helmfile — one
